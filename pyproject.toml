[project]
name = "orc-hestrator-server"
version = "2.0.0"
description = "MCP server for AI agent work management — persistent work item graph for AI agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Claudio Ferreira Filho"}]
keywords = ["mcp", "task-management", "ai-agents", "workflow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.0.0,<2",
    "pyyaml>=6.0",
    "croniter>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/filhocf/orc-hestrator"
Repository = "https://github.com/filhocf/orc-hestrator"

[project.scripts]
# F7 (ADR-007): transport is decided by the entry point, not by env.
# `orc-hestrator-server` is the distribution-homonym script (uvx orc-hestrator-server).
orc-hestrator-server = "task_orchestrator.server:main"
orc-hestrator = "task_orchestrator.server:main"
orc = "task_orchestrator.server:main"
orc-mcp = "task_orchestrator.server:main"
orc-serve = "task_orchestrator.server:main_http"
orc-ui = "task_orchestrator.ui.app:main"
# Legacy aliases: kept working, warn once on stderr (F7 R2).
task-orchestrator-py = "task_orchestrator.server:main_legacy"
task-orchestrator-ui = "task_orchestrator.ui.app:main_legacy"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
ui = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task_orchestrator"]

[tool.ruff]
# Pin the target version so lint results are reproducible across contributor
# machines and CI (ruff enables new rules over time; without this the CI badge
# can go red without any code change).
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]  # add import-sorting on top of ruff's default (E, F)
ignore = [
    # BLE001: blind `except Exception` is INTENTIONAL at the MCP tool boundary.
    # Every @mcp.tool wraps its body in `try/except Exception: return _err(e)` to
    # turn any failure into a structured MCP error response instead of crashing
    # the server. Deliberate project convention, not an oversight.
    "BLE001",
    # SIM118: false positive on sqlite3.Row — `key in row` matches by VALUE, not
    # by column name, so `key in row.keys()` is required and correct here.
    "SIM118",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "ruff>=0.17.1",
]
