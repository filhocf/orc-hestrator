# orc-hestrator.dev — static one-page site.
#
# Install:
#   sudo cp deploy/nginx/orc-hestrator.dev.conf /etc/nginx/sites-available/orc-hestrator.dev.conf
#   sudo ln -s /etc/nginx/sites-available/orc-hestrator.dev.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: run certbot AFTER the :80 block is live; it fills in the certificate
# paths (and the redirect) automatically:
#   sudo certbot --nginx -d orc-hestrator.dev -d www.orc-hestrator.dev --redirect
# The :443 block below is the expected post-certbot shape, left in place so the
# server block is complete if you point the certs manually instead.

server {
    listen 80;
    listen [::]:80;
    server_name orc-hestrator.dev www.orc-hestrator.dev;

    # HTTP -> HTTPS redirect (active once the cert is issued; certbot --redirect
    # produces exactly this).
    return 301 https://orc-hestrator.dev$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name orc-hestrator.dev www.orc-hestrator.dev;

    # Managed by certbot.
    ssl_certificate     /etc/letsencrypt/live/orc-hestrator.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orc-hestrator.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/orc-hestrator;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /styles.css {
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/orc-hestrator.dev.access.log;
    error_log  /var/log/nginx/orc-hestrator.dev.error.log;
}
