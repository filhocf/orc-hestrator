name: CI

# Actions are SHA-pinned (not moving tags) for supply-chain safety, mirroring the
# convention established in mcp-memory-service. Dependabot (github-actions group)
# proposes bumps; the trailing comment records the human-readable version.
# paths-ignore on push skips CI for docs-only changes; pull_request has no filter
# so required checks still report (same reasoning as mcp-memory-service ci.yml).

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md', 'LICENSE', '.gitignore']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      # Pin ruff so a new release with new rules can't turn CI red without a code
      # change. Bump this version deliberately. Config lives in pyproject [tool.ruff].
      - run: uv tool run ruff@0.17.0 check src/ tests/
      - run: uv tool run ruff@0.17.0 format --check src/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Install
        run: uv sync --extra test --extra ui
      - name: Test with coverage
        run: |
          uv pip install pytest-cov
          uv run pytest tests/ -v --tb=short --cov=src/task_orchestrator --cov-report=term --cov-fail-under=50

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Security check (bandit)
        run: |
          pip install bandit
          bandit -r src/ -ll -ii --skip B608
