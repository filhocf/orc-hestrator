test_name: "Orc UI - Admin / RBAC"
browser: "chromium"
headless: true
steps:
  # Login real (admin dev) — cookie de sessão HttpOnly
  - action: "open"
    url: "{{base_url}}/login"
  - action: "wait_for_load"
    state: "networkidle"
  - action: "fill"
    selector: "input#usuario"
    value: "admin"
  - action: "fill"
    selector: "input#senha"
    value: "orc-dev-2026"
  - action: "click"
    selector: "form button[type='submit']"
  - action: "wait_for_load"
    state: "networkidle"
  - action: "wait"
    duration: 800
  - action: "open"
    url: "{{base_url}}/admin"
  - action: "wait_for_load"
    state: "networkidle"
  - action: "verify_url"
    contains: "/admin"
  - action: "verify_text"
    selector: "body"
    contains: "Administração"
  # Workspaces reais (vazio -> estado vazio)
  - action: "verify_text"
    selector: "body"
    contains: "workspace"
  # RBAC marcado como futuro (honesto)
  - action: "verify_text"
    selector: "body"
    contains: "breve"
  # Logo corrigido: wordmark Orc[hestrator] no header (não "Orc Hub")
  - action: "verify_text"
    selector: "aside"
    contains: "hestrator"
  - action: "screenshot"
    path: "./screenshots/orc-admin.png"
    fullPage: true
