test_name: "Orc UI - Admin user management"
browser: "chromium"
headless: true
steps:
  # Login real (admin dev) — cookie de sessão HttpOnly
  - action: "open"
    url: "{{base_url}}/login"
  - action: "wait_for_load"
    state: "networkidle"
  - action: "fill"
    selector: "input#usuario"
    value: "admin"
  - action: "fill"
    selector: "input#senha"
    value: "orc-dev-2026"
  - action: "click"
    selector: "form button[type='submit']"
  - action: "wait_for_load"
    state: "networkidle"
  - action: "wait"
    duration: 800

  - action: "open"
    url: "{{base_url}}/admin"
  - action: "wait_for_load"
    state: "networkidle"
  - action: "wait"
    duration: 800

  - action: "verify_url"
    contains: "/admin"
  - action: "verify_text"
    selector: "body"
    contains: "Administração"
  # Seção de usuários REAL (não mais "em breve")
  - action: "verify_text"
    selector: "body"
    contains: "Usuários"
  # O admin (seed) aparece na lista real
  - action: "verify_text"
    selector: "body"
    contains: "admin"
  # Workspaces mantido
  - action: "verify_text"
    selector: "body"
    contains: "Workspaces"

  - action: "screenshot"
    path: "./screenshots/orc-admin.png"
    fullPage: true
