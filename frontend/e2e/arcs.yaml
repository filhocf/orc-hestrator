test_name: "Orc UI - Arcs tree"
browser: "chromium"
headless: true
steps:
  - action: "open"
    url: "{{base_url}}/login"
  - action: "evaluate"
    script: "localStorage.setItem('orc_auth','1')"
  - action: "open"
    url: "{{base_url}}/arcs"
  - action: "wait_for_load"
    state: "networkidle"

  - action: "verify_url"
    contains: "/arcs"

  # Arco raiz real
  - action: "verify_text"
    selector: "body"
    contains: "ARC: Core Pipeline"

  # Expandir o nó (lazy-load dos filhos). O botão/ícone de expandir:
  - action: "click"
    selector: "button:has-text('Expandir'), [aria-label*='xpandir'], .material-symbol:has-text('chevron_right')"
    onError: "continue"

  - action: "wait"
    duration: 1500

  # Após expandir, um filho real aparece
  - action: "verify_text"
    selector: "body"
    contains: "Refatorar parser de AST"

  - action: "screenshot"
    path: "./screenshots/orc-arcs.png"
    fullPage: true
