test_name: "Orc UI - Profile"
browser: "chromium"
headless: true
steps:
  # Login real (admin dev) — cookie de sessão HttpOnly
  - action: "open"
    url: "{{base_url}}/login"
  - action: "wait_for_load"
    state: "networkidle"
  - action: "fill"
    selector: "input#usuario"
    value: "admin"
  - action: "fill"
    selector: "input#senha"
    value: "orc-dev-2026"
  - action: "click"
    selector: "form button[type='submit']"
  - action: "wait_for_load"
    state: "networkidle"
  - action: "wait"
    duration: 800
  - action: "open"
    url: "{{base_url}}/profile"
  - action: "wait_for_load"
    state: "networkidle"
  - action: "verify_url"
    contains: "/profile"
  - action: "verify_text"
    selector: "body"
    contains: "Perfil"
  # Usuário logado (stub)
  - action: "verify_text"
    selector: "body"
    contains: "admin"
  # Preferências reais
  - action: "verify_text"
    selector: "body"
    contains: "Tema"
  - action: "screenshot"
    path: "./screenshots/orc-profile.png"
    fullPage: true
