test_name: "Orc UI - Task detail (via board link)"
browser: "chromium"
headless: true
steps:
  # Login real (admin dev) — cookie de sessão HttpOnly
  - action: "open"
    url: "{{base_url}}/login"
  - action: "wait_for_load"
    state: "networkidle"
  - action: "fill"
    selector: "input#usuario"
    value: "admin"
  - action: "fill"
    selector: "input#senha"
    value: "orc-dev-2026"
  - action: "click"
    selector: "form button[type='submit']"
  - action: "wait_for_load"
    state: "networkidle"
  - action: "wait"
    duration: 800
  - action: "open"
    url: "{{base_url}}/board"
  - action: "wait_for_load"
    state: "networkidle"

  # Clicar no título de um card (link bônus para /task/:id)
  - action: "click"
    selector: "a[href^='/task/']"
  - action: "wait_for_load"
    state: "networkidle"
  - action: "wait"
    duration: 800

  # Navegou para o detalhe
  - action: "verify_url"
    contains: "/task/"

  # Seções da tela de detalhe
  - action: "verify_text"
    selector: "body"
    contains: "Descrição"
  - action: "verify_text"
    selector: "body"
    contains: "Dependências"

  - action: "screenshot"
    path: "./screenshots/orc-task-detail.png"
    fullPage: true
